<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>NetLogger</title>
<style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;padding:2rem;line-height:1.5}
.k{color:#677483}.v{font-family:monospace}h2{font-size:14px;margin-top:1.5rem}
table{border-collapse:collapse;font-size:13px;margin-top:.5rem}td,th{padding:6px 12px;border-bottom:1px solid #222b36;text-align:left}
.ok{color:#3fb950}.bad{color:#f85149}</style></head>
<body>
  <h1>NetLogger <span class="v" id="ver"></span></h1>
  <p><span class="k">host:</span> <span class="v" id="host"></span> &nbsp; <span class="k">service:</span> <span class="v" id="svc"></span></p>
  <h2>Components</h2><table id="components"><thead><tr><th>component</th><th>health</th><th>coverage</th><th>tested</th><th>failing</th></tr></thead><tbody></tbody></table>
  <h2>Agents</h2><table id="agents"><thead><tr><th>node</th><th>online</th><th>last seen</th><th>error</th></tr></thead><tbody></tbody></table>
  <h2>Readiness</h2><div id="readiness"></div>
  <h2>Load test</h2>
  <p><input id="lt-target" placeholder="target node id" size="20"> <button onclick="runLoad()">Run iperf3</button></p>
  <pre id="lt-out" class="v"></pre>
<script>
// All cell content is set via textContent (never innerHTML), so values that
// originate from other agents' responses (errors, labels, details) cannot
// inject HTML/script into the operator's dashboard.
function cell(text, cls){ const td=document.createElement('td'); td.textContent=text==null?'':String(text); if(cls) td.className=cls; return td; }
function row(cells){ const tr=document.createElement('tr'); cells.forEach(c=>tr.appendChild(c)); return tr; }

fetch('/api/status').then(r=>r.json()).then(s=>{
  document.getElementById('ver').textContent=s.version;
  document.getElementById('host').textContent=s.host;
  document.getElementById('svc').textContent=s.service_state;
});

fetch('/api/components').then(r=>r.json()).then(rows=>{
  const tb=document.querySelector('#components tbody');
  rows.forEach(c=>{
    const cls=c.health==='good'?'ok':(c.health==='untested'?'':'bad');
    tb.appendChild(row([cell(c.label||c.id), cell(c.health,cls), cell(c.coverage), cell(c.tested_paths), cell(c.failing_paths)]));
  });
});

fetch('/api/agents').then(r=>r.json()).then(rows=>{
  const tb=document.querySelector('#agents tbody');
  rows.forEach(a=>{
    tb.appendChild(row([cell(a.id), cell(a.online?'yes':'no', a.online?'ok':'bad'), cell(a.last_seen_unix_us||'-'), cell(a.last_err||'')]));
  });
});

fetch('/api/readiness').then(r=>r.json()).then(list=>{
  const root=document.getElementById('readiness');
  list.forEach(n=>{
    const h=document.createElement('div');
    const title=document.createElement('b'); title.textContent=n.node_id; h.appendChild(title);
    h.appendChild(document.createTextNode(' ('+n.issues+' issue'+(n.issues===1?'':'s')+')'));
    const tbl=document.createElement('table'); const tb=document.createElement('tbody'); tbl.appendChild(tb);
    (n.checks||[]).forEach(c=>{ tb.appendChild(row([cell(c.name), cell(c.ok?'OK':'FAIL', c.ok?'ok':'bad'), cell(c.detail||'')])); });
    h.appendChild(tbl); root.appendChild(h);
  });
});

function runLoad(){
  const t=document.getElementById('lt-target').value;
  document.getElementById('lt-out').textContent='running...';
  fetch('/api/loadtest?target='+encodeURIComponent(t)+'&duration=5',{method:'POST'})
    .then(r=>r.json()).then(j=>{document.getElementById('lt-out').textContent=JSON.stringify(j,null,2);});
}
</script>
</body>
</html>
